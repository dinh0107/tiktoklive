name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
            backend/package-lock.json

      - name: Root deps
        run: npm ci --omit=dev

      - name: Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Backend
        working-directory: backend
        run: |
          npm ci
          npm run build

      - name: Smoke — public entrypoints
        run: |
          test -f frontend/dist/index.html
          test -f frontend/dist/control.html
          test -f backend/dist/index.js
